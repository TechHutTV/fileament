name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify release commit
        env:
          VALIDATED_COMMIT: ${{ needs.validate.outputs.commit }}
        run: python3 .github/scripts/verify_release_commit.py --tag "${GITHUB_REF_NAME}" --commit "${VALIDATED_COMMIT}"

      - name: Validate release note policy
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/fileament
        run: |
          python3 .github/scripts/prepare_release_notes.py \
            --tag "${GITHUB_REF_NAME}" \
            --image "${IMAGE}" \
            --repository "${GITHUB_REPOSITORY}" \
            --validate-only

      - name: Prepare release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/fileament
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="${RUNNER_TEMP}/release-notes.md"
          generated="${RUNNER_TEMP}/generated-notes.md"
          if [[ "${tag##*.}" == "0" ]]; then
            :
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${tag}" --jq '.body'
          fi > "${generated}"
          python3 .github/scripts/prepare_release_notes.py \
            --tag "${tag}" \
            --image "${IMAGE}" \
            --repository "${GITHUB_REPOSITORY}" \
            --generated-notes-file "${generated}" \
            --output "${notes}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/fileament
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="${RUNNER_TEMP}/release-notes.md"
          gh release create "${tag}" \
            --verify-tag \
            --title "Fileament ${tag}" \
            --notes-file "${notes}"
