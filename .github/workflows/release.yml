name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release note policy
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/fileament
        run: |
          python3 .github/scripts/prepare_release_notes.py \
            --tag "${GITHUB_REF_NAME}" \
            --image "${IMAGE}" \
            --repository "${GITHUB_REPOSITORY}" \
            --validate-only

      - name: Prepare release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/fileament
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="${RUNNER_TEMP}/release-notes.md"
          generated="${RUNNER_TEMP}/generated-notes.md"
          if [[ "${tag##*.}" == "0" ]]; then
            :
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${tag}" --jq '.body'
          fi > "${generated}"
          python3 .github/scripts/prepare_release_notes.py \
            --tag "${tag}" \
            --image "${IMAGE}" \
            --repository "${GITHUB_REPOSITORY}" \
            --generated-notes-file "${generated}" \
            --output "${notes}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fileament
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="${RUNNER_TEMP}/release-notes.md"
          gh release create "${tag}" \
            --verify-tag \
            --title "Fileament ${tag}" \
            --notes-file "${notes}"
