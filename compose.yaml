services:
  fileament:
    build: .
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FILEAMENT_DATA_DIR: /data
      FILEAMENT_PORT: "8080"
    volumes:
      - fileament-data:/data

volumes:
  fileament-data:
